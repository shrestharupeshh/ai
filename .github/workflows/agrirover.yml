name: AgriRover
on:
  push:
    paths: ["agrirover/**", ".github/workflows/agrirover.yml"]
  pull_request:
    paths: ["agrirover/**"]
jobs:
  software-and-firmware:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agrirover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Python dependencies
        run: pip install -e "software[dashboard,dev]" xacro yourdfpy
      - name: Firmware host tests (ASan/UBSan)
        run: make -C firmware test
      - name: Firmware STM32 cross-build
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
          make -C firmware stm32
      - name: Python tests (unit, vision, 14 simulation scenarios, dashboard API, ROS asset consistency)
        run: cd software && python -m pytest -q

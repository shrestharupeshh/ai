# Nav2 (ROS 2 Jazzy) parameters for AgriRover GH-1.
# STATUS: written against the Jazzy parameter reference; NOT yet executed (no ROS runtime in the authoring environment).
# Expect a tuning pass on first bring-up. Values that encode design requirements are commented with their source.
amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: likelihood_field
    laser_max_range: 12.0            # RPLIDAR C1
    max_particles: 2000
    min_particles: 500
    update_min_d: 0.10
    update_min_a: 0.10
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    set_initial_pose: true
    initial_pose: {x: 1.0, y: 0.4, z: 0.0, yaw: 0.0}     # dock (config/greenhouse.yaml)
    transform_tolerance: 0.5

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 25.0     # same idea as blocked_skip_s in the reference navigator
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.04           # R-NAV-02 stop repeatability
      yaw_goal_tolerance: 0.04
      stateful: true
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.5
      forward_sampling_distance: 0.35
      rotate_to_heading_angular_vel: 0.9
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0
      desired_linear_vel: 0.30          # R-MOB-02
      lookahead_dist: 0.35
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.50
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # footprint = software/agrirover/config.py::footprint_outline() (bumper, chamfered deck, wheels)
      footprint: "[[0.25, 0.125], [0.19, 0.15], [0.05, 0.177], [-0.05, 0.177], [-0.19, 0.15], [-0.23, 0.11], [-0.23, -0.11], [-0.19, -0.15], [-0.05, -0.177], [0.05, -0.177], [0.19, -0.15], [0.25, -0.125]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: "LaserScan", raytrace_max_range: 4.0, obstacle_max_range: 3.5}
      inflation_layer: {plugin: "nav2_costmap_2d::InflationLayer", cost_scaling_factor: 6.0, inflation_radius: 0.35}
      keepout_filter: {plugin: "nav2_costmap_2d::KeepoutFilter", filter_info_topic: "/costmap_filter_info"}

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.25, 0.125], [0.19, 0.15], [0.05, 0.177], [-0.05, 0.177], [-0.19, 0.15], [-0.23, 0.11], [-0.23, -0.11], [-0.19, -0.15], [-0.05, -0.177], [0.05, -0.177], [0.19, -0.15], [0.25, -0.125]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      static_layer: {plugin: "nav2_costmap_2d::StaticLayer", map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: "LaserScan", raytrace_max_range: 4.0, obstacle_max_range: 3.5}
      inflation_layer: {plugin: "nav2_costmap_2d::InflationLayer", cost_scaling_factor: 6.0, inflation_radius: 0.35}
      keepout_filter: {plugin: "nav2_costmap_2d::KeepoutFilter", filter_info_topic: "/costmap_filter_info"}

# Benches are invisible to the 2D lidar (only their legs are in the scan plane): their footprints come from the facility
# drawing through the keep-out mask generated by tools/gen_ros_assets.py.
costmap_filter_info_server:
  ros__parameters:
    type: 0
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
filter_mask_server:
  ros__parameters:
    frame_id: map
    topic_name: "/keepout_filter_mask"
    yaml_filename: ""                   # set by navigation.launch.py

map_server:
  ros__parameters:
    yaml_filename: ""                   # set by navigation.launch.py

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.05
      allow_unknown: false
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother: {plugin: "nav2_smoother::SimpleSmoother", tolerance: 1.0e-10, max_its: 1000, do_refinement: true}

behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    spin: {plugin: "nav2_behaviors::Spin"}
    backup: {plugin: "nav2_behaviors::BackUp"}
    wait: {plugin: "nav2_behaviors::Wait"}
    max_rotational_vel: 0.9
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.2]       # R-MOB-01
    min_velocity: [-0.15, 0.0, -1.2]
    max_accel: [0.5, 0.0, 2.0]          # R-MOB-03
    max_decel: [-1.5, 0.0, -3.0]        # controlled-stop deceleration (mechanical calcs section 6)
    odom_topic: "/odometry/filtered"
    velocity_timeout: 0.5

# Independent protective field between the controller and the base: stops for anything inside the polygon, slows in the
# wider one. Mirrors PathFollower.protective_field() in the reference navigator.
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.2
    source_timeout: 0.5                 # stale scan -> stop (lidar failure, test T-SAF-06)
    stop_pub_timeout: 2.0
    polygons: ["stop_zone", "slow_zone"]
    stop_zone:
      type: polygon
      points: "[[0.40, 0.21], [0.40, -0.21], [0.25, -0.21], [0.25, 0.21]]"
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: polygon_stop
    slow_zone:
      type: polygon
      points: "[[0.85, 0.21], [0.85, -0.21], [0.25, -0.21], [0.25, 0.21]]"
      action_type: slowdown
      slowdown_ratio: 0.4
      min_points: 3
      visualize: true
      polygon_pub_topic: polygon_slow
    observation_sources: ["scan"]
    scan: {type: scan, topic: /scan}

waypoint_follower:
  ros__parameters:
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint: {plugin: "nav2_waypoint_follower::WaitAtWaypoint", enabled: true, waypoint_pause_duration: 1500}

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agrirover"
version = "0.1.0"
description = "AgriRover GH-1: ROS-independent core (kinematics, navigation, simulation, vision, mission, storage)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8", "pyyaml>=6", "pyserial>=3.5"]

[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn>=0.27"]
sensors = ["adafruit-blinka", "adafruit-circuitpython-scd4x", "adafruit-circuitpython-sht4x", "adafruit-circuitpython-as7341"]
ml = ["onnxruntime>=1.17"]
dev = ["pytest>=8", "httpx>=0.27", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["agrirover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

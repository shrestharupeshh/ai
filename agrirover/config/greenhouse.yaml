# Reference greenhouse used for simulation and as the template for a site survey.
# Frame "map": origin at the south-west inside corner, x east (along benches), y north. Units: metres.
name: reference_lettuce_house
room: {x: 12.0, y: 6.8}
bench:                      # rolling / fixed benches with NFT channels, canopy at ~0.85 m
  length: 8.0
  width: 1.2
  top_z: 0.80
  leg_size: 0.06            # only the legs are visible to the 2D lidar (scan plane 0.215 m)
  leg_pitch: 2.0
  x0: 2.0
benches_y0: [0.8, 2.8, 4.8] # south edge of each bench  -> four 0.8 m aisles
aisle_width: 0.8
dock: {x: 1.0, y: 0.4, yaw: 0.0}        # start / charge position (head corridor, aisle 0)
stations:
  pitch: 1.0                # along-aisle distance between inspection stops
  x_first: 2.5
  count: 8
plants:
  rows_per_side: 2          # rows visible from one aisle (near half of the bench)
  per_station: 4            # plants per row within one camera view
  spacing: 0.25
obstacles:                  # static clutter not in the facility drawing (seen by the lidar only)
  - {name: crate, x: 11.0, y: 3.4, size: [0.4, 0.3]}
camera:
  hfov_deg: 70.0            # Logitech C920-class UVC camera (assumed; measure the real lens)
  vfov_deg: 43.0

# AgriRover GH-1 — single source of truth for design parameters.
# Consumed by: mechanical/calcs, electrical/calcs, mechanical/cad, the URDF
# generator, the headless simulator and the ROS 2 parameter files.
# Units: SI unless the key name says otherwise (_mm, _g, _wh ...).
# Change control: any edit here must be reflected in docs/01_requirements.md
# (requirement IDs are quoted in comments).

meta:
  name: AgriRover GH-1
  revision: A
  date: "2026-11-10"

requirements:            # see docs/01_requirements.md
  max_length_m: 0.50     # R-MEC-01
  max_width_m: 0.40      # R-MEC-02
  max_height_m: 1.45     # R-MEC-03 (mast included)
  max_mass_kg: 15.0      # R-MEC-04 (incl. payload)
  payload_kg: 2.0        # R-MEC-05
  v_max: 0.50            # R-MOB-01  m/s
  v_inspect: 0.30        # R-MOB-02  m/s nominal aisle transit
  a_max: 0.50            # R-MOB-03  m/s^2
  ground_clearance_m: 0.030   # R-MEC-06
  aisle_min_transit_m: 0.60   # R-ENV-03
  aisle_min_uturn_m: 0.70     # R-ENV-04
  ramp_grade: 0.05       # R-ENV-05 (floor drain slopes / door thresholds)
  runtime_h: 4.0         # R-PWR-01
  energy_reserve_frac: 0.20   # R-PWR-02
  stop_distance_m: 0.15  # R-SAF-02 from v_max

chassis:
  # Frame: x forward, y left, z up. Origin = ground point below drive axle centre.
  plate_length_mm: 460
  plate_width_mm: 300
  plate_corner_chamfer_mm: 40
  lower_plate_thk_mm: 4.0      # 5052-H32 aluminium
  upper_plate_thk_mm: 3.0
  deck_post_len_mm: 100        # 2020 extrusion posts between decks
  lower_plate_bottom_z_mm: 73  # motors underslung
  track_width_mm: 330          # wheel centre to wheel centre
  wheel_diameter_mm: 100       # Pololu 3278
  wheel_width_mm: 24
  caster_x_mm: 190             # +/- from axle, on centreline
  front_caster_gap_mm: 2.0     # front caster shimmed above ground plane
  mast_height_mm: 1070         # 2020 extrusion length above the upper deck
  mast_x_mm: -150
  camera_z_mm: 1230            # optical centre above floor (adjustable 800-1400)
  camera_tilt_deg: 35          # below horizontal, looking sideways
  lidar_x_mm: 150
  lidar_scan_z_mm: 215

motor:                   # Pololu 4754 (70:1 37Dx70L, 12 V, 64 CPR encoder), values @12 V
  gear_ratio: 70
  no_load_rpm: 150
  no_load_current_a: 0.2
  stall_torque_nm: 2.648       # 27 kg.cm (extrapolated per Pololu)
  stall_current_a: 5.5
  max_cont_torque_nm: 0.981    # 10 kg.cm gearbox recommendation
  encoder_cpr_motor: 64
  mass_kg: 0.235
  shaft_diameter_mm: 6.0
  winding_resistance_ohm: 2.18 # 12 V / 5.5 A

battery:                 # Bioenno BLF-1212A, 4S LiFePO4 with internal BMS/PCM
  chemistry: LiFePO4
  nominal_v: 12.8
  max_v: 14.6
  min_v: 10.0            # BMS cut-off region; firmware stops earlier
  capacity_ah: 12.0
  max_cont_discharge_a: 20.0   # reseller-quoted, verify on the unit label
  mass_kg: 1.5
  size_mm: [215, 56, 79]

traction:
  crr: 0.03              # polyurethane on sealed concrete incl. caster losses (assumed)
  mu_dry: 0.6            # PU on dry concrete (assumed, conservative)
  mu_wet: 0.35           # wet sealed concrete (assumed)
  drivetrain_eff: 0.85   # wheel adapter + tyre hysteresis; gearbox loss is in motor data

mass_budget_kg:          # estimates until CAD mass properties replace them
  lower_plate: 1.42
  upper_plate: 1.06
  posts_and_brackets: 0.45
  mast_assembly: 0.75
  motors: 0.47
  motor_brackets: 0.10
  wheels_adapters: 0.50
  casters: 0.30
  battery: 1.50
  sbc_and_storage: 0.15
  control_pcb_mcu_drivers: 0.20
  dcdc_and_wiring: 0.45
  lidar: 0.11
  cameras_and_mounts: 0.40
  env_sensor_pod: 0.15
  skirts_covers_bumper: 0.90
  estop_switch_leds: 0.15
  fasteners: 0.35

power_loads_w:           # at the battery terminals unless noted
  sbc_idle: 3.5          # Raspberry Pi 5 8 GB (typ.)
  sbc_nav: 6.5           # Nav stack running
  sbc_cv_peak: 10.0      # CV inference burst
  lidar: 1.3
  cameras: 2.0           # two UVC cameras
  mcu_sensors: 0.8
  wifi_extra: 0.7
  leds_misc: 0.5
  dcdc_efficiency: 0.90

mission_profile:         # fraction of time; used for the energy estimate
  driving: 0.35
  turning: 0.10
  stopped_inspecting: 0.45
  idle: 0.10
